name: Release - build and store artifacts
on:
  workflow_dispatch:
  # push:
    # tags:
      # - '[0-9]+.[0-9]+.[0-9]+'
      # - '[0-9]+.[0-9]+.[0-9]+-*'
jobs:
  build-and-store-artifacts:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - name: Build
        run: dotnet build src --configuration Release
      - name: Publish example console app
        run: dotnet publish src/TotallyLegit.App/TotallyLegit.App.csproj --no-build --output assets
      - name: Sign NuGet packages
        uses: Particular/sign-nuget-packages-action@v1.0.0
        with:
         client-id: ${{ secrets.AZURE_KEY_VAULT_CLIENT_ID }}
         tenant-id: ${{ secrets.AZURE_KEY_VAULT_TENANT_ID }}
         client-secret: ${{ secrets.AZURE_KEY_VAULT_CLIENT_SECRET }}
         certificate-name: ${{ secrets.AZURE_KEY_VAULT_CERTIFICATE_NAME }}
      - name: Publish assets
        uses: actions/upload-artifact@v7.0.2
        with:
          name: assets
          path: assets/*
          retention-days: 1
      - name: Create draft release and attach assets
        uses: particular/deployment-workflows/.github/actions/create-draft-release-with-assets@main
        with:
          asset-paths: "nugets/, powershellModules/, assets/"
